[package]
name = "monitor"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.105"
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive", "env"] }
humantime = "2.4.0"
libc = "0.2.191"
ratatui = "0.30.2"
regex = "1.13.1"
